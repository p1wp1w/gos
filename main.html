<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2330;
    --border: #2a3045;
    --accent: #5b8fff;
    --accent2: #a78bfa;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e8ecf5;
    --text-dim: #7a86a3;
    --radius: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Fira Sans", sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }
  #app { position: relative; z-index: 1; width: 100%; max-width: 820px; padding: 0 20px 60px; }

  /* HEADER */
  header {
    padding: 32px 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .logo {
    font-family: "Syne", sans-serif;
    font-size: 1.1rem; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .score-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.82rem; font-weight: 500;
    color: var(--text-dim);
  }
  .score-chip span { color: var(--accent); font-weight: 600; }

  /* LOADING */
  .loading-container {
    text-align: center;
    padding: 60px 20px;
  }
  .spinner {
    border: 4px solid rgba(91, 136, 255, 0.2);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text {
    color: var(--text-dim);
    margin-top: 20px;
  }

  /* PROGRESS */
  .progress-wrap {
    height: 4px; background: var(--surface2);
    border-radius: 99px; overflow: hidden; margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  /* HOME — part selector */
  .home-header {
    margin-bottom: 28px;
  }
  .home-header h1 {
    font-family: "Syne", sans-serif;
    font-size: 2rem; font-weight: 800; margin-bottom: 8px;
  }
  .home-header p { color: var(--text-dim); font-size: 0.95rem; line-height: 1.6; }

  .options-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .opt-label {
    font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
    margin-right: 4px;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.9rem; cursor: pointer; user-select: none;
  }
  .checkbox-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .parts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .part-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
    position: relative; overflow: hidden;
  }
  .part-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0; transition: opacity 0.2s;
  }
  .part-card:hover { border-color: var(--accent); transform: translateY(-3px); background: #1a2035; }
  .part-card:hover::before { opacity: 1; }
  .part-num {
    font-family: "Syne", sans-serif;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .part-title {
    font-family: "Syne", sans-serif;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 6px;
  }
  .part-range { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px; }
  .part-progress-bar {
    height: 3px; background: var(--border);
    border-radius: 99px; overflow: hidden; margin-bottom: 8px;
  }
  .part-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
  }
  .part-stats { font-size: 0.78rem; color: var(--text-dim); display: flex; justify-content: space-between; }
  .part-stats .done { color: var(--correct); font-weight: 500; }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
    animation: fadeSlide 0.3s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-meta {
    font-size: 0.74rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 16px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  }
  .q-part-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 0.68rem; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; letter-spacing: 0.06em;
  }
  .q-text {
    font-family: "Syne", sans-serif;
    font-size: 1.15rem; font-weight: 600; line-height: 1.6;
    color: var(--text); margin-bottom: 28px;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .ans-btn {
    width: 100%; text-align: left;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 15px 20px;
    font-family: "Fira Sans", sans-serif;
    font-size: 0.97rem; font-weight: 400;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    transition: border-color 0.18s, background 0.18s, transform 0.12s;
  }
  .ans-btn:hover:not(:disabled) { border-color: var(--accent); background: #1a2035; transform: translateX(4px); }
  .ans-btn .letter {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: "Syne", sans-serif; font-size: 0.78rem; font-weight: 700;
    flex-shrink: 0; transition: all 0.2s;
  }
  .ans-btn.correct { border-color: var(--correct); background: rgba(52,211,153,.08); }
  .ans-btn.correct .letter { background: var(--correct); border-color: var(--correct); color: #0d0f14; }
  .ans-btn.wrong { border-color: var(--wrong); background: rgba(248,113,113,.08); }
  .ans-btn.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: #0d0f14; }
  .ans-btn:disabled { cursor: default; transform: none; }

  .feedback {
    margin-top: 18px; padding: 14px 18px;
    border-radius: 10px; font-size: 0.92rem; font-weight: 500;
    display: none;
  }
  .feedback.show { display: block; animation: fadeSlide 0.2s ease; }
  .feedback.ok { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: var(--correct); }
  .feedback.fail { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--wrong); }

  .controls { display: flex; gap: 12px; margin-top: 24px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .controls-right { display: flex; gap: 12px; }
  .btn {
    padding: 11px 26px; border-radius: 10px; border: none; cursor: pointer;
    font-family: "Syne", sans-serif; font-size: 0.88rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: opacity 0.15s, transform 0.12s;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }
  .btn-sm { padding: 8px 16px; font-size: 0.78rem; }

  /* RESULTS */
  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 48px 36px;
    text-align: center; animation: fadeSlide 0.4s ease;
  }
  .result-card .part-label {
    font-family: "Syne", sans-serif; font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }
  .big-score {
    font-family: "Syne", sans-serif; font-size: 4.5rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .result-card .sub { color: var(--text-dim); font-size: 1rem; margin: 12px 0 32px; }
  .stats-row { display: flex; gap: 16px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-box {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 22px; min-width: 100px;
  }
  .stat-box .val { font-family: "Syne", sans-serif; font-size: 1.6rem; font-weight: 700; }
  .stat-box .lbl { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .val.c { color: var(--correct); }
  .val.w { color: var(--wrong); }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    .card { padding: 22px 18px; }
    .q-text { font-size: 1rem; }
    .result-card { padding: 32px 20px; }
    .big-score { font-size: 3rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">QCM Prep</div>
    <div class="score-chip" id="scoreChip">Score <span id="liveScore">0</span> / <span id="liveTotal">0</span></div>
  </header>

  <!-- LOADING PANEL -->
  <div id="loadingPanel">
    <div class="loading-container">
      <h2>Loading Questions...</h2>
      <div class="spinner"></div>
      <p class="loading-text" id="loadingStatus">Fetching questions from qs file...</p>
    </div>
  </div>

  <!-- HOME -->
  <div id="homePanel" class="hidden">
    <div class="home-header">
      <h1>Choose a Part</h1>
      <p id="homeDescription">500 questions split into 5 parts of 100. Questions are in original order.<br>Track your progress part by part.</p>
    </div>

    <div class="options-bar">
      <span class="opt-label">Options</span>
      <label class="checkbox-row">
        <input type="checkbox" id="shuffleAns" checked>
        Shuffle answer order
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="showImmediately" checked>
        Show answer immediately
      </label>
    </div>

    <div class="parts-grid" id="partsGrid"></div>
  </div>

  <!-- QUIZ -->
  <div id="quizPanel" class="hidden">
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="card" id="questionCard">
      <div class="q-meta">
        <span id="qMeta"></span>
        <span class="q-part-badge" id="qPartBadge"></span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="answers" id="answersDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
      <div class="controls">
        <button class="btn btn-ghost btn-sm" id="backHomeBtn">← Parts</button>
        <div class="controls-right">
          <button class="btn btn-ghost" id="skipBtn">Skip</button>
          <button class="btn btn-primary hidden" id="nextBtn">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="resultsPanel" class="hidden">
    <div class="result-card">
      <div class="part-label" id="resultPartLabel"></div>
      <div class="big-score" id="bigScore"></div>
      <div class="sub" id="resultSub"></div>
      <div class="stats-row">
        <div class="stat-box"><div class="val c" id="rCorrect">0</div><div class="lbl">Correct</div></div>
        <div class="stat-box"><div class="val w" id="rWrong">0</div><div class="lbl">Wrong</div></div>
        <div class="stat-box"><div class="val" id="rSkipped">0</div><div class="lbl">Skipped</div></div>
        <div class="stat-box"><div class="val" id="rTotal">0</div><div class="lbl">Total</div></div>
      </div>
      <div class="controls" style="justify-content:center; gap:12px; flex-wrap:wrap;">
        <button class="btn btn-ghost" id="retryBtn">Retry Part</button>
        <button class="btn btn-ghost" id="backHomeBtn2">← All Parts</button>
        <button class="btn btn-primary" id="nextPartBtn">Next Part →</button>
      </div>
    </div>
  </div>
</div>

<script>
let allQuestions = [];
let PARTS = [];
const QUESTIONS_PER_PART = 100;

// Auto-load questions on page load
window.addEventListener('load', () => {
  autoLoadQuestions();
});

function autoLoadQuestions() {
  document.getElementById('loadingStatus').textContent = 'Fetching questions from qs file...';
  
  fetch('qs')
    .then(response => {
      if (!response.ok) {
        throw new Error('Failed to load qs file');
      }
      return response.json();
    })
    .then(data => {
      allQuestions = data;
      
      if (!Array.isArray(allQuestions) || allQuestions.length === 0) {
        throw new Error('Invalid or empty question file');
      }

      // Validate questions format
      allQuestions.forEach((q, idx) => {
        if (!q.question || !q.answers || q.correct === undefined) {
          throw new Error(`Question ${idx + 1} is missing required fields`);
        }
        if (!Array.isArray(q.answers)) {
          throw new Error(`Question ${idx + 1}: answers must be an array`);
        }
      });

      // Split questions into parts
      splitIntoParts();
      initApp();
    })
    .catch(error => {
      console.error('Error loading questions:', error);
      document.getElementById('loadingStatus').textContent = 'Could not load questions. Please refresh the page.';
    });
}

function splitIntoParts() {
  PARTS = [];
  for (let i = 0; i < allQuestions.length; i += QUESTIONS_PER_PART) {
    PARTS.push(allQuestions.slice(i, i + QUESTIONS_PER_PART));
  }
}

// App State
let currentPart = null;
let currentQIdx = 0;
let answers = {};
let answerMapping = {};
const LETTERS = ['A', 'B', 'C', 'D'];

function initApp() {
  document.getElementById('loadingPanel').classList.add('hidden');
  document.getElementById('homePanel').classList.remove('hidden');
  renderParts();
  
  // Event listeners
  document.getElementById('backHomeBtn').addEventListener('click', backHome);
  document.getElementById('backHomeBtn2').addEventListener('click', backHome);
  document.getElementById('skipBtn').addEventListener('click', skip);
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('retryBtn').addEventListener('click', retryPart);
  document.getElementById('nextPartBtn').addEventListener('click', nextPart);
}

function renderParts() {
  const grid = document.getElementById('partsGrid');
  grid.innerHTML = '';
  
  PARTS.forEach((part, idx) => {
    const card = document.createElement('div');
    card.className = 'part-card';
    card.onclick = () => startPart(idx);
    
    const done = localStorage.getItem(`part_${idx}_done`) || 0;
    const total = part.length;
    const percent = (done / total) * 100;
    
    card.innerHTML = `
      <div class="part-num">Part ${idx + 1}</div>
      <div class="part-title">Questions ${idx * QUESTIONS_PER_PART + 1}-${Math.min((idx + 1) * QUESTIONS_PER_PART, allQuestions.length)}</div>
      <div class="part-range">${total} questions</div>
      <div class="part-progress-bar">
        <div class="part-progress-fill" style="width: ${percent}%"></div>
      </div>
      <div class="part-stats">
        <span>Progress</span>
        <span class="done">${done}/${total}</span>
      </div>
    `;
    
    grid.appendChild(card);
  });
}

function startPart(idx) {
  currentPart = idx;
  currentQIdx = 0;
  answers = {};
  answerMapping = {};
  
  document.getElementById('homePanel').classList.add('hidden');
  document.getElementById('quizPanel').classList.remove('hidden');
  document.getElementById('resultsPanel').classList.add('hidden');
  
  displayQuestion();
}

function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function displayQuestion() {
  const part = PARTS[currentPart];
  const q = part[currentQIdx];
  const globalIdx = currentPart * QUESTIONS_PER_PART + currentQIdx;
  
  // Meta
  document.getElementById('qMeta').textContent = `Q ${currentQIdx + 1}/${part.length}`;
  document.getElementById('qPartBadge').textContent = `PART ${currentPart + 1}`;
  
  // Question
  document.getElementById('qText').textContent = q.question;
  
  // Progress
  const prog = ((currentQIdx + 1) / part.length) * 100;
  document.getElementById('progressFill').style.width = prog + '%';
  document.getElementById('liveTotal').textContent = part.length;
  updateScore();
  
  // Answers
  let displayAnswers = q.answers;
  answerMapping[currentQIdx] = q.correct;
  
  if (document.getElementById('shuffleAns').checked) {
    const indices = [...q.answers.keys()];
    const shuffled = shuffleArray(indices);
    displayAnswers = shuffled.map(i => q.answers[i]);
    const correctDisplay = shuffled.indexOf(q.correct);
    answerMapping[currentQIdx] = correctDisplay;
  }
  
  const div = document.getElementById('answersDiv');
  div.innerHTML = '';
  
  displayAnswers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    if (answers[currentQIdx] === i) btn.classList.add('selected');
    
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span>${ans}`;
    btn.onclick = () => selectAnswer(i);
    
    div.appendChild(btn);
  });
  
  document.getElementById('feedbackDiv').classList.remove('show');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('skipBtn').classList.remove('hidden');
}

function selectAnswer(idx) {
  answers[currentQIdx] = idx;
  
  const btns = document.querySelectorAll('.ans-btn');
  btns.forEach(b => b.classList.remove('selected'));
  btns[idx].classList.add('selected');
  
  if (document.getElementById('showImmediately').checked) {
    checkAnswer();
  }
}

function checkAnswer() {
  const part = PARTS[currentPart];
  const q = part[currentQIdx];
  
  if (answers[currentQIdx] === undefined) return;
  
  const userAns = answers[currentQIdx];
  const correctAns = answerMapping[currentQIdx];
  const isCorrect = userAns === correctAns;
  
  // Feedback
  const fb = document.getElementById('feedbackDiv');
  fb.className = isCorrect ? 'feedback show ok' : 'feedback show fail';
  fb.textContent = isCorrect 
    ? '✓ Correct!' 
    : `✗ Wrong! Correct: ${q.answers[q.correct]}`;
  
  // Highlight
  const btns = document.querySelectorAll('.ans-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('selected');
    if (i === correctAns) b.classList.add('correct');
    else if (i === userAns && !isCorrect) b.classList.add('wrong');
  });
  
  document.getElementById('skipBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  
  updateScore();
}

function updateScore() {
  let correct = 0;
  const part = PARTS[currentPart];
  
  Object.entries(answers).forEach(([idx, ansIdx]) => {
    if (ansIdx === answerMapping[idx]) correct++;
  });
  
  document.getElementById('liveScore').textContent = correct;
}

function skip() {
  nextQuestion();
}

function nextQuestion() {
  currentQIdx++;
  if (currentQIdx < PARTS[currentPart].length) {
    displayQuestion();
  } else {
    finishPart();
  }
}

function nextPart() {
  if (currentPart < PARTS.length - 1) {
    startPart(currentPart + 1);
  } else {
    backHome();
  }
}

function backHome() {
  document.getElementById('homePanel').classList.remove('hidden');
  document.getElementById('quizPanel').classList.add('hidden');
  document.getElementById('resultsPanel').classList.add('hidden');
  renderParts();
}

function retryPart() {
  startPart(currentPart);
}

function finishPart() {
  const part = PARTS[currentPart];
  let correct = 0, wrong = 0, skipped = 0;
  
  Object.entries(answers).forEach(([idx, ansIdx]) => {
    if (ansIdx === undefined) skipped++;
    else if (ansIdx === answerMapping[idx]) correct++;
    else wrong++;
  });
  
  const total = part.length;
  const percent = Math.round((correct / total) * 100);
  
  // Save progress
  localStorage.setItem(`part_${currentPart}_done`, correct);
  
  // Display results
  document.getElementById('resultPartLabel').textContent = `Part ${currentPart + 1} Results`;
  document.getElementById('bigScore').textContent = `${percent}%`;
  document.getElementById('resultSub').textContent = `${correct} out of ${total} correct`;
  document.getElementById('rCorrect').textContent = correct;
  document.getElementById('rWrong').textContent = wrong;
  document.getElementById('rSkipped').textContent = skipped;
  document.getElementById('rTotal').textContent = total;
  
  // Hide/show next part button
  if (currentPart < PARTS.length - 1) {
    document.getElementById('nextPartBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextPartBtn').classList.add('hidden');
  }
  
  document.getElementById('quizPanel').classList.add('hidden');
  document.getElementById('resultsPanel').classList.remove('hidden');
}
</script>
